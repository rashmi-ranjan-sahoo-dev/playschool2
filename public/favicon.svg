<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient matching Bal Sanskar branding -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="45%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>

    <!-- Feather Glow & Shading Gradients -->
    <linearGradient id="featherEmerald" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="featherTeal" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0E7490"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="featherBlue" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#034694"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Drop Shadow for crisp visibility at small favicon sizes -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Icon Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <!-- Subtle inner border highlight -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Mascot / Peacock Emblem with subtle shadow -->
  <g filter="url(#shadow)">
    <!-- Peacock Tail Fan (5 Joyful Plumes) -->
    <!-- Plume 1 (Far Left) -->
    <path d="M32 38 C24 35 15 28 17 18 C20 12 28 22 32 38 Z" fill="url(#featherTeal)"/>
    <ellipse cx="20" cy="18" rx="3" ry="4.5" transform="rotate(-25 20 18)" fill="url(#goldGrad)"/>
    <circle cx="19.5" cy="17.5" r="1.6" fill="#034694"/>

    <!-- Plume 2 (Mid Left) -->
    <path d="M32 38 C27 30 22 18 26 12 C30 8 33 22 32 38 Z" fill="url(#featherEmerald)"/>
    <ellipse cx="27" cy="13" rx="3.2" ry="4.8" transform="rotate(-10 27 13)" fill="url(#goldGrad)"/>
    <circle cx="26.8" cy="12.8" r="1.7" fill="#0E7490"/>

    <!-- Plume 3 (Center Top) -->
    <path d="M32 38 C29 27 28 14 32 8 C36 14 35 27 32 38 Z" fill="url(#featherBlue)"/>
    <ellipse cx="32" cy="11" rx="3.3" ry="5" fill="url(#goldGrad)"/>
    <circle cx="32" cy="10.8" r="1.8" fill="#1D4ED8"/>

    <!-- Plume 4 (Mid Right) -->
    <path d="M32 38 C31 22 34 8 38 12 C42 18 37 30 32 38 Z" fill="url(#featherEmerald)"/>
    <ellipse cx="37" cy="13" rx="3.2" ry="4.8" transform="rotate(10 37 13)" fill="url(#goldGrad)"/>
    <circle cx="37.2" cy="12.8" r="1.7" fill="#0E7490"/>

    <!-- Plume 5 (Far Right) -->
    <path d="M32 38 C36 22 44 12 47 18 C49 28 40 35 32 38 Z" fill="url(#featherTeal)"/>
    <ellipse cx="44" cy="18" rx="3" ry="4.5" transform="rotate(25 44 18)" fill="url(#goldGrad)"/>
    <circle cx="44.5" cy="17.5" r="1.6" fill="#034694"/>

    <!-- Peacock Crest (Golden 3-tiara crown) -->
    <line x1="32" y1="26" x2="28" y2="21" stroke="#FDE047" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="28" cy="21" r="1.2" fill="#FDE047"/>
    <line x1="32" y1="26" x2="32" y2="20" stroke="#FDE047" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="32" cy="20" r="1.2" fill="#FDE047"/>
    <line x1="32" y1="26" x2="36" y2="21" stroke="#FDE047" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="36" cy="21" r="1.2" fill="#FDE047"/>

    <!-- Peacock Body (Graceful & Cute Toddler Mascot Proportion) -->
    <!-- Chest & Belly -->
    <path d="M32 25 C26 25 24 33 26 43 C28 51 36 51 38 43 C40 33 38 25 32 25 Z" fill="url(#bodyGrad)"/>
    <!-- Cute belly patch -->
    <ellipse cx="32" cy="42" rx="4.5" ry="6" fill="#38BDF8" fill-opacity="0.85"/>

    <!-- Peacock Head -->
    <circle cx="32" cy="28" r="5" fill="url(#bodyGrad)"/>
    <!-- Cheerful Eye -->
    <circle cx="34" cy="27" r="1.4" fill="#FFFFFF"/>
    <circle cx="34.4" cy="27" r="0.8" fill="#0F172A"/>
    <circle cx="34.6" cy="26.7" r="0.3" fill="#FFFFFF"/>

    <!-- Beak (Pointing slightly right & joyful) -->
    <polygon points="36,27 41,29 36,31" fill="url(#goldGrad)"/>

    <!-- Joyful Wing -->
    <path d="M28 35 C28 35 24 38 26 44 C27 46 30 45 31 41 Z" fill="#0369A1"/>
  </g>

  <!-- Playful Little Golden Sparkles -->
  <path d="M12 46 L13 49 L16 50 L13 51 L12 54 L11 51 L8 50 L11 49 Z" fill="#FEF08A" opacity="0.9"/>
  <circle cx="51" cy="45" r="1.5" fill="#FEF08A" opacity="0.85"/>
  <circle cx="15" cy="28" r="1" fill="#FFFFFF" opacity="0.75"/>
</svg>